<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Defect Code Lookup</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #111111;
      --card-border: #222222;
      --card-active: #1c1c1c;
      --text-main: #f8fafc;
      --text-sub: #a1a1aa;
      --primary: #2563eb;
      --primary-light: #38bdf8;

      --code-bg: #000000;
      --code-border: #38bdf8;
      --code-text: #38bdf8;

      --en-color: #f1f5f9;
      --vn-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }

    /* Sticky Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 16px 16px 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: #fff;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .stats-pill {
      font-size: 12px;
      background: #141414;
      border: 1px solid #2a2a2a;
      padding: 5px 12px;
      border-radius: 20px;
      color: #38bdf8;
      font-weight: 700;
      white-space: nowrap;
    }

    /* Search Box */
    .search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      margin-top: 4px;
      margin-bottom: 16px;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      color: #64748b;
      pointer-events: none;
      width: 20px;
      height: 20px;
    }

    .search-input {
      width: 100%;
      background: #141414;
      border: 1.5px solid #2a2a2a;
      border-radius: 14px;
      padding: 14px 44px 14px 44px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.2s ease;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .search-input:focus {
      border-color: #38bdf8;
      background: #000000;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.25);
    }

    .search-input::placeholder {
      color: #64748b;
      font-size: 13.5px;
    }

    .clear-btn {
      position: absolute;
      right: 12px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #2a2a2a;
      border: none;
      color: #fff;
      font-size: 13px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .clear-btn.visible {
      display: flex;
    }

    /* Filter Chips */
    .filter-chips {
      display: flex;
      gap: 6px;
      margin-top: 0;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .filter-chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      background: #141414;
      border: 1px solid #262626;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 14px;
      white-space: nowrap;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .chip.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
    }

    .chip-badge {
      font-size: 9px;
      background: rgba(255, 255, 255, 0.18);
      padding: 1px 5px;
      border-radius: 8px;
    }


    /* Result counter bar */
    .result-info {
      padding: 14px 16px 8px;
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Results container */
    .results-container {
      padding: 8px 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      flex: 1;
    }

    /* Result Card */
    .card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      transition: transform 0.15s ease, border-color 0.15s ease;
      cursor: pointer;
    }

    .card:active {
      transform: scale(0.985);
      background: var(--card-active);
      border-color: #38bdf8;
    }

    /* Defect Code Header */
    .card-code-section {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #222222;
    }

    .label-header {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .code-box {
      display: inline-block;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 0.8px;
      padding: 5px 16px;
      border-radius: 12px;
      border-width: 2px;
      border-style: solid;
      line-height: 1.1;
    }

    .code-S {
      color: #ff4d4f;
      border-color: #ff4d4f;
      background: rgba(255, 77, 79, 0.08);
      box-shadow: 0 0 12px rgba(255, 77, 79, 0.2);
    }

    .code-P {
      color: #38bdf8;
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.2);
    }

    .code-A {
      color: #34d399;
      border-color: #34d399;
      background: rgba(52, 211, 153, 0.08);
      box-shadow: 0 0 12px rgba(52, 211, 153, 0.2);
    }

    .copy-btn {
      background: #1c1c1c;
      border: 1px solid #2e2e2e;
      color: #e2e8f0;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .copy-icon {
      width: 14px;
      height: 14px;
      stroke: #38bdf8;
      stroke-width: 2;
      vertical-align: middle;
      display: inline-block;
      flex-shrink: 0;
    }

    .copy-btn:active {
      background: #2a2a2a;
      transform: scale(0.95);
    }

    /* Field Blocks - Exactly the 3 column names */
    .field-box {
      margin-top: 10px;
      background: #141414;
      border: 1px solid #242424;
      border-radius: 12px;
      padding: 10px 12px;
    }

    .field-box.box-vn {
      border-left: 4px solid #38bdf8;
    }

    .field-box.box-en {
      border-left: 4px solid #a855f7;
    }

    .field-name {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 3px;
    }

    .field-value {
      font-size: 15px;
      line-height: 1.45;
      word-break: break-word;
    }

    .box-vn .field-value {
      color: #38bdf8;
      font-weight: 600;
    }

    .box-en .field-value {
      color: #f1f5f9;
      font-weight: 500;
    }

    /* Highlight matching terms */
    mark {
      background-color: #fbbf24;
      color: #0f172a;
      border-radius: 3px;
      padding: 1px 3px;
      font-weight: 700;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #64748b;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .empty-title {
      font-size: 17px;
      color: #94a3b8;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .empty-desc {
      font-size: 13px;
      margin-bottom: 18px;
    }

    .btn-reset {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-content {
      background: #111111;
      width: 100%;
      max-width: 520px;
      border-radius: 24px 24px 0 0;
      padding: 18px 20px 32px;
      border-top: 1px solid #2a2a2a;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.8);
      animation: slideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from {
        transform: translateY(100%);
      }

      to {
        transform: translateY(0);
      }
    }

    .modal-handle {
      width: 44px;
      height: 5px;
      background: #333333;
      border-radius: 3px;
      margin: 0 auto 16px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(18, 18, 18, 0.96);
      border: 1.5px solid #38bdf8;
      color: #f8fafc;
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 999;
      opacity: 0;
      transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>

<body>

  <!-- Sticky Mobile Header -->
  <header>
    <div class="header-top">
      <div>
        <div class="brand-title">Tra Cứu Mã Lỗi (Defect Code)</div>
      </div>
      <div class="stats-pill" id="totalCountBadge">Chinh</div>
    </div>

    <!-- Search Input -->
    <div class="search-wrapper">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="search" id="searchInput" class="search-input"
        placeholder="Nhập Defect Code, Tiếng Anh, hoặc Tiếng Việt..." autocomplete="off" autocorrect="off"
        autocapitalize="off" spellcheck="false">
      <button id="clearBtn" class="clear-btn" title="Xóa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <!-- Filter Chips -->
    <div class="filter-chips">
      <button class="chip active" data-filter="ALL">
        <span>Tất cả</span>
        <span class="chip-badge" id="badgeAll">153</span>
      </button>
      <button class="chip" data-filter="S">
        <span>Mã S (An toàn)</span>
        <span class="chip-badge">15</span>
      </button>
      <button class="chip" data-filter="P">
        <span>Mã P (Chức năng)</span>
        <span class="chip-badge">90</span>
      </button>
      <button class="chip" data-filter="A">
        <span>Mã A (Ngoại quan)</span>
        <span class="chip-badge">48</span>
      </button>
    </div>
  </header>


  <!-- Results Count Bar -->
  <div class="result-info">
    <span id="resultCountText">Đang hiển thị 153 mã</span>
  </div>

  <!-- Results List -->
  <main class="results-container" id="resultsContainer">
    <!-- Populated by JavaScript -->
  </main>

  <!-- Empty State -->
  <div class="empty-state" id="emptyState" style="display: none;">
    <div class="empty-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width: 52px; height: 52px; stroke: #475569; display: inline-block;">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>
    <div class="empty-title">Không tìm thấy kết quả phù hợp</div>
    <div class="empty-desc">Thử tìm kiếm với từ khóa khác</div>
    <button class="btn-reset" onclick="resetSearch()">Xóa tìm kiếm</button>
  </div>

  <!-- Detail Bottom Sheet Modal -->
  <div class="modal-backdrop" id="detailModal">
    <div class="modal-content" id="modalContent">
      <div class="modal-handle"></div>

      <!-- 1. Defect Code -->
      <div style="margin-bottom: 14px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <div class="field-name" style="margin-bottom: 0;">Defect Code</div>
          <button class="copy-btn" id="btnModalCopyCode" title="Sao chép Defect Code">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>Copy Code
          </button>
        </div>
        <div id="modalCode" class="code-box" style="font-size: 22px; padding: 6px 18px;"></div>
      </div>

      <!-- 2. Defect Description In Vietnamese -->
      <div class="field-box box-vn" style="margin-bottom: 12px; padding: 14px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <div class="field-name" style="margin-bottom: 0;">Defect Description In Vietnamese</div>
          <button class="copy-btn" id="btnModalCopyVn" title="Sao chép tiếng Việt">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>Copy
          </button>
        </div>
        <div class="field-value" id="modalVn" style="font-size: 16px; margin-top: 4px; font-weight: 700;"></div>
      </div>

      <!-- 3. Defect Description In English -->
      <div class="field-box box-en" style="margin-bottom: 20px; padding: 14px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <div class="field-name" style="margin-bottom: 0;">Defect Description In English</div>
          <button class="copy-btn" id="btnModalCopyEn" title="Sao chép tiếng Anh">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 13px; height: 13px; vertical-align: -2px; margin-right: 4px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>Copy
          </button>
        </div>
        <div class="field-value" id="modalEn" style="font-size: 15px; margin-top: 4px;"></div>
      </div>

      <div style="display: flex; gap: 12px;">
        <button class="btn-reset" style="flex: 1; padding: 14px; background: #2563eb; display: inline-flex; align-items: center; justify-content: center; gap: 6px;" id="btnModalCopy">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 16px; height: 16px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>Sao chép toàn bộ
        </button>
        <button class="btn-reset" style="padding: 14px 22px; background: #334155; color: #cbd5e1;" id="btnModalClose">
          Đóng
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <svg viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="width: 18px; height: 18px; flex-shrink: 0;">
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>
    <span id="toastMsg">Đã sao chép!</span>
  </div>

  <script>

    // Fast Vietnamese accent remover for searching
    function removeAccents(str) {
      if (!str) return '';
      return str
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/đ/g, 'd')
        .replace(/Đ/g, 'D')
        .toLowerCase()
        .trim();
    }

    const itemsMap = new Map();

      const type = item.code.charAt(0).toUpperCase();
      const processed = {
        code: item.code,
        en: item.en,
        vn: item.vn,
        type: type,
        cleanCode: item.code.toLowerCase(),
        cleanEn: removeAccents(item.en),
        cleanVn: removeAccents(item.vn)
      };
      itemsMap.set(item.code, processed);
      return processed;
    });

    // Highlight text helper with Vietnamese accent support
    function highlightText(text, keyword) {
      if (!keyword || !text) return escapeHtml(text);
      const cleanKeyword = removeAccents(keyword);
      if (!cleanKeyword) return escapeHtml(text);

      const normText = text.normalize('NFC');
      const cleanCharIndices = [];
      let cleanT = '';

      for (let i = 0; i < normText.length; i++) {
        const ch = normText[i];
        const cleanCh = removeAccents(ch);
        cleanT += cleanCh;
        for (let k = 0; k < cleanCh.length; k++) {
          cleanCharIndices.push(i);
        }
      }

      const idx = cleanT.indexOf(cleanKeyword);
      if (idx === -1) return escapeHtml(text);

      const startOrig = cleanCharIndices[idx];
      const endOrig = cleanCharIndices[idx + cleanKeyword.length - 1] + 1;

      const before = text.substring(0, startOrig);
      const match = text.substring(startOrig, endOrig);
      const after = text.substring(endOrig);

      return `${escapeHtml(before)}<mark>${escapeHtml(match)}</mark>${escapeHtml(after)}`;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    // Toast
    let toastTimeout = null;
    function showToast(msg) {
      toastMsg.innerText = msg;
      toast.classList.add('show');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    // Copy to clipboard
    function copyText(text, label = 'mã') {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(`Đã sao chép ${label}!`);
        }).catch(() => fallbackCopy(text, label));
      } else {
        fallbackCopy(text, label);
      }
    }

    function fallbackCopy(text, label) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.appendChild(textarea);
      textarea.select();
      try {
        document.execCommand('copy');
        showToast(`Đã sao chép ${label}!`);
      } catch (err) {
        showToast('Không thể sao chép');
      }
      document.body.removeChild(textarea);
    }

    // Modal
    function openModal(item) {
      currentModalItem = item;
      modalCode.className = `code-box code-${item.type}`;
      modalCode.innerText = item.code;
      modalVn.innerText = item.vn;
      modalEn.innerText = item.en;
      detailModal.classList.add('open');
    }

    function closeModal() {
      detailModal.classList.remove('open');
    }

    detailModal.addEventListener('click', (e) => {
      if (e.target === detailModal) closeModal();
    });
    modalContent.addEventListener('click', (e) => e.stopPropagation());
    btnModalClose.addEventListener('click', closeModal);

    btnModalCopy.addEventListener('click', () => {
      if (!currentModalItem) return;
      const full = `Defect Code: ${currentModalItem.code}\nDefect Description In Vietnamese: ${currentModalItem.vn}\nDefect Description In English: ${currentModalItem.en}`;
      copyText(full, 'toàn bộ thông tin');
    });

    btnModalCopyCode.addEventListener('click', () => {
      if (!currentModalItem) return;
      copyText(currentModalItem.code, `Defect Code ${currentModalItem.code}`);
    });

    btnModalCopyVn.addEventListener('click', () => {
      if (!currentModalItem) return;
      copyText(currentModalItem.vn, `mô tả tiếng Việt`);
    });

    btnModalCopyEn.addEventListener('click', () => {
      if (!currentModalItem) return;
      copyText(currentModalItem.en, `mô tả tiếng Anh`);
    });

    // Render cards
    function render() {
      const query = currentSearchTerm.trim();
      const cleanQ = removeAccents(query);

      let filtered = searchIndex;

      // Filter by category
      if (currentFilter !== 'ALL') {
        filtered = filtered.filter(item => item.type === currentFilter);
      }

      // Filter across all 3 columns
      if (cleanQ) {
        filtered = filtered.filter(item => {
          return item.cleanCode.includes(cleanQ) ||
            item.cleanEn.includes(cleanQ) ||
            item.cleanVn.includes(cleanQ);
        });
      }

      resultCountText.innerText = `Tìm thấy ${filtered.length} / ${RAW_DATA.length} mã`;

      if (filtered.length === 0) {
        resultsContainer.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';

      // Build cards with exact 3 headers: Defect Code, Defect Description In English, Defect Description In Vietnamese
      const html = filtered.map(item => {
        const highlightedCode = highlightText(item.code, query);
        const highlightedVn = highlightText(item.vn, query);
        const highlightedEn = highlightText(item.en, query);

        return `
          <article class="card" data-code="${escapeHtml(item.code)}">
            <!-- 1. Defect Code -->
            <div class="card-code-section">
              <div class="label-header">Defect Code</div>
              <span class="code-box code-${item.type}">${highlightedCode}</span>
            </div>

            <!-- 2. Defect Description In Vietnamese -->
            <div class="field-box box-vn">
              <div class="field-name">Defect Description In Vietnamese</div>
              <div class="field-value">${highlightedVn}</div>
            </div>

            <!-- 3. Defect Description In English -->
            <div class="field-box box-en">
              <div class="field-name">Defect Description In English</div>
              <div class="field-value">${highlightedEn}</div>
            </div>
          </article>
        `;
      }).join('');

      resultsContainer.innerHTML = html;
    }

    // Delegated click handler on resultsContainer
    resultsContainer.addEventListener('click', (e) => {
      const copyBtn = e.target.closest('[data-copy]');
      if (copyBtn) {
        e.stopPropagation();
        const code = copyBtn.getAttribute('data-copy');
        copyText(code, `Defect Code ${code}`);
        return;
      }

      const card = e.target.closest('.card');
      if (card) {
        const code = card.getAttribute('data-code');
        const item = itemsMap.get(code);
        if (item) openModal(item);
      }
    });

    // Reset search
    function resetSearch() {
      searchInput.value = '';
      currentSearchTerm = '';
      clearBtn.classList.remove('visible');
      currentFilter = 'ALL';
      filterChips.forEach(c => c.classList.toggle('active', c.dataset.filter === 'ALL'));
      render();
      searchInput.focus();
    }

    // Input events
    searchInput.addEventListener('input', (e) => {
      currentSearchTerm = e.target.value;
      clearBtn.classList.toggle('visible', currentSearchTerm.length > 0);
      render();
    });

    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      currentSearchTerm = '';
      clearBtn.classList.remove('visible');
      render();
      searchInput.focus();
    });

    // Category chips
    filterChips.forEach(chip => {
      chip.addEventListener('click', () => {
        filterChips.forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        currentFilter = chip.dataset.filter;
        render();
      });
    });

    // Initial render
    render();
  </script>
</body>

</html>
